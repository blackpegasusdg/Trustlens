<!DOCTYPE html>
<html>
<head>
    <title>TrustLens - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="auth-container">

    <div class="logo">
        TRUST<span>LENS</span>
    </div>

    <p class="subtitle">
        AI-Powered Social Media Security
    </p>

    <div class="card">

        <h2>Welcome Back</h2>

        <p class="muted">
            Login to the TrustLens social platform
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert {{ category }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}

        <form method="POST">

            <label>Username</label>

            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required
            >

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p class="bottom-text">
            Don't have an account?
            <a href="{{ url_for('social.register') }}">
                Create one
            </a>
        </p>

    </div>

</div>

</body>
</html>
